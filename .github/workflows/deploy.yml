name: Deploy to AWS
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main

jobs:
  build-and-test-new-site:
    runs-on: ubuntu-latest
    name: "Build and Test - New Site"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install playwright && machine dependencies
      run: npx playwright install --with-deps

    - name: Install dependencies
      run: npm install

    - name: Run tests (CI optimized) - New Site
      run: npm run test:ci

    - name: Build new site
      run: npm run build

    - name: Upload new site build
      uses: actions/upload-artifact@v4.6.2
      with:
        name: new-site-build
        path: build/

  build-and-test-old-site:
    runs-on: ubuntu-latest
    name: "Build and Test - Old Site"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Setup Node.js for old site
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: old-site/package-lock.json

    - name: Install playwright && machine dependencies
      run: npx playwright install --with-deps

    - name: Install old site dependencies
      working-directory: ./old-site
      run: npm install

    - name: Run tests - Old Site
      working-directory: ./old-site
      run: npm run test:quick

    - name: Build old site
      working-directory: ./old-site
      run: npm run build

    - name: Upload old site build
      uses: actions/upload-artifact@v4.6.2
      with:
        name: old-site-build
        path: old-site/build/

  build-dual-site:
    needs: [build-and-test-new-site, build-and-test-old-site]
    runs-on: ubuntu-latest
    name: "Combine Sites for Deployment"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Download new site build
      uses: actions/download-artifact@v4.1.7
      with:
        name: new-site-build
        path: build/

    - name: Download old site build
      uses: actions/download-artifact@v4.1.7
      with:
        name: old-site-build
        path: old-site-temp/

    - name: Combine builds
      run: |
        mkdir -p build/old
        cp -r old-site-temp/* build/old/
        ls -la build/
        ls -la build/old/

    - name: Upload combined production build
      uses: actions/upload-artifact@v4.6.2
      with:
        name: production-build
        path: build/

  deploy:
    needs: build-dual-site
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download production build
        uses: actions/download-artifact@v4.1.7
        with:
          name: production-build
          path: build/

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pulumi/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Install Pulumi dependencies
        working-directory: ./pulumi
        run: npm install

      - name: Configure Pulumi stack
        working-directory: ./pulumi
        run: |
          pulumi stack select romdj/zerotoone-solutions/production --create
          pulumi config set aws:region ${{ secrets.AWS_REGION }}
          pulumi config set zerotoone-solutions:domainName ${{ secrets.DOMAIN_NAME }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy infrastructure
        working-directory: ./pulumi
        run: pulumi up --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Sync files to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.DOMAIN_NAME }}/ --delete --exact-timestamps
          
      - name: Invalidate CloudFront
        working-directory: ./pulumi
        run: |
          DISTRIBUTION_ID=$(pulumi stack output distributionId)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}